<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard - The Odin Project</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="main-container">
      <div class="header">
        <div class="header-upper">
          <div class="header-search-icon">
            <img src="/assets/magnify.png" alt="search icon" class="search" />
          </div>

          <div class="header-search-bar"></div>

          <div class="header-notifications-icon">
            <img
              src="/assets/bell-ring-outline.png"
              alt="notifications icon"
              class="notifications"
            />
          </div>

          <div class="header-profile-picture">
            <img
              src="https://images.pexels.com/photos/709143/pexels-photo-709143.jpeg"
              alt="prfile picture"
              class="profile-picture"
            />
          </div>

          <div class="header-user-name">
            <h3 class="user-name">Morgan Oakley</h3>
          </div>
        </div>

        <div class="header-lower">
          <div class="lower-profile-picture">
            <img
              src="https://images.pexels.com/photos/709143/pexels-photo-709143.jpeg"
              alt="profile-picture"
              class="profile-picture-lower"
            />
          </div>

          <div class="header-lower-greetings">
            <h6>Hi there,</h6>
            <h3>Morgan Oakley (@morgan)</h3>
          </div>

          <div class="header-lower-buttons">
            <button class="button-new">New</button>
            <button class="button-upload">Upload</button>
            <button class="button-share">Share</button>
          </div>
        </div>
      </div>

      <div class="sidebar">
        <div class="dashboard">
          <div class="dashboard-icon">
            <img
              src="/assets/view-dashboard-outline.png"
              alt="dashboard icon"
              class="img-dashboard"
            />
          </div>
          <h2 class="dashboard-text">Dashboard</h2>
        </div>

        <div class="dashboard-options-1">
          <ul class="list-items">
            <li></li>
            <li>
              <img
                src="/assets/home-variant-outline.png"
                class="img-dashboard-options"
                id="home"
                alt="home icon"
              />Home
            </li>
            <li>
              <img
                src="/assets/card-account-details.png"
                class="img-dashboard-options"
                id="profile"
                alt="profile icon"
              />Profile
            </li>
            <li>
              <img
                src="/assets/message-reply-outline.png"
                class="img-dashboard-options"
                id="message"
                alt="messages icon"
              />Messages
            </li>
            <li>
              <img
                src="/assets/history.png"
                class="img-dashboard-options"
                id="history"
                alt="history icon"
              />History
            </li>
            <li>
              <img
                src="/assets/checkbox-marked-circle-plus-outline.png"
                class="img-dashboard-options"
                id="tasks"
                alt="tasks icon"
              />Tasks
            </li>
            <li>
              <img
                src="/assets/account-group.png"
                class="img-dashboard-options"
                id="communities"
                alt="communities icon"
              />Communities
            </li>
          </ul>
        </div>

        <!-- <div class="dashboard-options-2"> -->
        <div class="dashboard-options-2">
          <ul class="list-items">
            <li>
              <img
                src="/assets/cog.png"
                class="img-dashboard-options"
                id="settings"
                alt="settings icon"
              />Settings
            </li>
            <li>
              <img
                src="/assets/help-box.png"
                class="img-dashboard-options"
                id="support"
                alt="support icon"
              />Support
            </li>
            <li>
              <img
                src="/assets/shield-check-outline.png"
                class="img-dashboard-options"
                id="privacy"
                alt="privacy icon"
              />Privacy
            </li>
          </ul>
        </div>

        </div>
      </div>

      <div class="main-content-container"></div>
    </div>
  </body>
</html>
